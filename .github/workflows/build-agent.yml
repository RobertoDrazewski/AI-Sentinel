name: Compilar agente local (Windows + Mac)

# Se dispara a mano desde la pestaña "Actions" de GitHub (botón "Run workflow") --
# no corre solo en cada push, porque instalar PyTorch/OpenCV/YOLO en cada compilación
# es pesado y no hace falta un build nuevo por cada cambio de código.
on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ai-sentinel-agent-windows
          - os: macos-latest # Apple Silicon (M1/M2/M3/M4)
            artifact_name: ai-sentinel-agent-mac-applesilicon
          - os: macos-15-intel # Intel (Macs 2020 o anteriores) -- Roberto mismo tiene una
            # Mac Intel, así que esta build hace falta sí o sí. GitHub retiró "macos-13"
            # en dic/2025 (quedaba en cola para siempre); "macos-15-intel" es la etiqueta
            # vigente para runners Intel.
            artifact_name: ai-sentinel-agent-mac-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.10 (Windows -- el del runner de GitHub sirve)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Python 3.10 (Mac -- el oficial de python.org, NO el del runner)
        if: runner.os == 'macOS'
        shell: bash
        # El Python que trae el runner de GitHub (macos-latest / macos-15-intel) está
        # compilado en una Mac con una versión de macOS mucho más nueva que la de
        # muchos clientes (ej: Roberto mismo, con un MacBook Pro de 2012 en macOS 12
        # Monterey). Ese Python usa una función del sistema ("mkfifoat") que Apple
        # agregó recién en una versión de macOS más nueva -- en una Mac vieja el
        # agente ya compilado no arranca, sin ningún error visible al hacer doble
        # clic (confirmado corriendo el binario desde la Terminal: "Symbol not
        # found: (_mkfifoat), Expected in: /usr/lib/libSystem.B.dylib"). El
        # instalador oficial de python.org SÍ está compilado para andar en Macs
        # viejas (universal2, Apple Silicon + Intel, desde macOS 11 en adelante).
        run: |
          curl -fsSL -o python.pkg "https://www.python.org/ftp/python/3.10.11/python-3.10.11-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          PYBIN="/Library/Frameworks/Python.framework/Versions/3.10/bin"
          sudo ln -sf "$PYBIN/python3.10" "$PYBIN/python"
          sudo ln -sf "$PYBIN/pip3.10" "$PYBIN/pip"
          echo "$PYBIN" >> "$GITHUB_PATH"
          "$PYBIN/python3.10" --version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copiar el frontend compilado al backend (mismo esquema que el Dockerfile)
        shell: bash
        run: |
          rm -rf backend/static_frontend
          cp -r frontend/dist backend/static_frontend

      - name: Instalar dependencias de Python
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          # ultralytics instala "opencv-python" (con gui) como dependencia propia
          # además del "opencv-python-headless" que ya pedimos en requirements.txt
          # -- los dos escriben en la misma carpeta "cv2/" del venv y quedan
          # mezclados. Con los dos instalados juntos, cv2.VideoCapture(...,
          # cv2.CAP_FFMPEG) queda roto en el agente ya compilado (ninguna cámara
          # RTSP puede conectar, sin ningún error de Python -- tardamos horas en
          # encontrar esto). OJO: desinstalar sólo "opencv-python" (dejando
          # "opencv-python-headless" como está) NO alcanza -- como comparten
          # archivos, sacar uno solo deja al otro roto a medias (ej:
          # "AttributeError: module 'cv2' has no attribute 'setNumThreads'").
          # Hay que sacar los DOS y reinstalar sólo el headless de cero.
          pip uninstall -y opencv-python opencv-python-headless
          pip install opencv-python-headless==4.10.0.84 --no-deps

      - name: Descargar modelos de reconocimiento facial (YuNet + SFace)
        working-directory: backend
        shell: bash
        run: bash scripts/download_models.sh

      - name: Descargar y ubicar el modelo YOLO (detección de objetos)
        working-directory: backend
        shell: bash
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"
          mv yolov8n.pt app/models_data/yolov8n.pt

      - name: Generar los íconos del instalador (el mismo que "agregar a pantalla de inicio" en el celular)
        working-directory: backend
        shell: bash
        run: |
          pip install pillow
          python scripts/make_icons.py

      - name: Empaquetar con PyInstaller
        working-directory: backend
        shell: bash
        # Usamos el ai-sentinel-agent.spec (en vez de repetir acá todas las opciones
        # a mano) para que la build de GitHub Actions sea EXACTAMENTE la misma que
        # la que se compila a mano en una Mac -- incluye el "upx=False" (UPX rompía
        # la conexión RTSP en el agente empaquetado en Mac, sin ningún error visible)
        # y el ajuste de ruta de los .dylib de FFmpeg que trae cv2. Si hace falta
        # cambiar algo del empaquetado (datas, hidden-imports, etc), se edita el
        # .spec una sola vez y queda igual en todos lados.
        run: pyinstaller ai-sentinel-agent.spec

      - name: Firmar y comprimir la app de Mac (antes de que upload-artifact la toque)
        if: runner.os == 'macOS'
        working-directory: backend
        shell: bash
        # Dos problemas reales de Mac que hay que resolver ACÁ, en el mismo runner de
        # macOS, antes de subir nada:
        # 1) Firma: una app sin NINGUNA firma (ni siquiera ad-hoc) puede aparecer como
        #    "dañada" en Mac en vez del aviso normal de "desarrollador no identificado".
        #    La firmamos con "-" (ad-hoc, sin certificado pago de Apple) para que macOS
        #    al menos la reconozca como "con firma".
        # 2) Symlinks: "AI Sentinel.app" trae symlinks por dentro (Python.framework,
        #    dylibs de cv2). actions/upload-artifact NO preserva symlinks al subir una
        #    carpeta -- si subiéramos la carpeta tal cual, el bundle llega roto/
        #    incompleto al job que arma el Release (esto es, caso casi seguro, la causa
        #    real de "la app no se puede abrir" que le pasó a Roberto). La solución es
        #    comprimirla ACÁ MISMO, en el runner de Mac donde se generó, con `ditto`
        #    (la herramienta de Apple para esto -- preserva symlinks y metadata mejor
        #    que zip) -- lo que sube el artifact es ya un .zip íntegro, nunca la carpeta
        #    suelta.
        run: |
          codesign --force --deep --sign - "dist/AI Sentinel.app"
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "AI Sentinel.app" "ai-sentinel-agent-mac.zip"
          rm -rf "AI Sentinel.app"
          cd ..

      - name: Subir el resultado como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: backend/dist/
          retention-days: 30

  # Junta los ejecutables de los dos jobs de arriba y los publica como Release
  # en AI-Sentinel-Releases -- un repo APARTE, público, que no tiene nada de
  # código fuente (ver frontend: pages/Download.tsx usa ese link fijo
  # "releases/latest/download/<archivo>" para los botones de descarga). Así
  # un cliente cualquiera puede bajar el instalador sin login de GitHub, sin
  # que este repo (el del código, con toda la lógica de licencias) deje de
  # ser privado.
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar los ejecutables compilados en el job anterior
        uses: actions/download-artifact@v4
        with:
          path: built

      - name: Armar los archivos con el nombre final de descarga
        # Windows sigue siendo un .exe suelto. Mac ya viene comprimido en un .zip desde
        # el propio job de macOS (paso "Firmar y comprimir la app de Mac" de arriba) --
        # acá sólo hace falta copiarlo con el nombre final. A PROPÓSITO no volvemos a
        # tocar/re-zipear el .app acá: este job corre en Ubuntu, y re-zipear ahí un
        # bundle de Mac (o dejar que upload-artifact suba la carpeta suelta) es
        # justamente lo que rompía los symlinks internos y dejaba la app "dañada".
        run: |
          mkdir -p release-files
          cp built/ai-sentinel-agent-windows/ai-sentinel-agent.exe release-files/ai-sentinel-agent-windows.exe
          cp built/ai-sentinel-agent-mac-applesilicon/ai-sentinel-agent-mac.zip release-files/ai-sentinel-agent-mac-applesilicon.zip
          cp built/ai-sentinel-agent-mac-intel/ai-sentinel-agent-mac.zip release-files/ai-sentinel-agent-mac-intel.zip

      - name: Publicar como Release en AI-Sentinel-Releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            release-files/ai-sentinel-agent-windows.exe \
            release-files/ai-sentinel-agent-mac-applesilicon.zip \
            release-files/ai-sentinel-agent-mac-intel.zip \
            --repo RobertoDrazewski/AI-Sentinel-Releases \
            --title "AI Sentinel Agent - build ${{ github.run_number }}" \
            --notes "Compilado automáticamente desde AI-Sentinel @ ${{ github.sha }}"